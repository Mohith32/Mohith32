<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mohith Kumar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#EDE3CF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#EDE3CF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDE3CF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EDE3CF" stop-opacity="0"/>
    </linearGradient>

    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#EDE3CF" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>

    <clipPath id="frame"><rect width="1200" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- instrument, cropped off the right edge -->
    <g transform="translate(955 160)">
      <g fill="none" stroke="#EDE3CF" stroke-linecap="round">
        <circle r="150" stroke-width="1.3" stroke-opacity="0.5" filter="url(#sketch)"/>
        <circle r="118" stroke-width="1" stroke-opacity="0.38" filter="url(#sketch)"/>
        <circle r="86" stroke-width="1" stroke-opacity="0.3" filter="url(#sketch)"/>
      </g>

      <!-- tick marks -->
      <g stroke="#EDE3CF" stroke-linecap="round" filter="url(#sketch)">
        <g stroke-opacity="0.55" stroke-width="1.4">
          <line x1="0" y1="-150" x2="0" y2="-166"/>
          <line x1="0" y1="150" x2="0" y2="166"/>
          <line x1="-150" y1="0" x2="-166" y2="0"/>
          <line x1="150" y1="0" x2="166" y2="0"/>
        </g>
        <g stroke-opacity="0.3" stroke-width="1">
          <line x1="106.07" y1="-106.07" x2="117.4" y2="-117.4"/>
          <line x1="-106.07" y1="-106.07" x2="-117.4" y2="-117.4"/>
          <line x1="106.07" y1="106.07" x2="117.4" y2="117.4"/>
          <line x1="-106.07" y1="106.07" x2="-117.4" y2="117.4"/>
        </g>
        <g stroke-opacity="0.22" stroke-width="0.9">
          <line x1="129.9" y1="-75" x2="141.4" y2="-81.6"/>
          <line x1="75" y1="-129.9" x2="81.6" y2="-141.4"/>
          <line x1="-129.9" y1="-75" x2="-141.4" y2="-81.6"/>
          <line x1="-75" y1="-129.9" x2="-81.6" y2="-141.4"/>
          <line x1="129.9" y1="75" x2="141.4" y2="81.6"/>
          <line x1="75" y1="129.9" x2="81.6" y2="141.4"/>
          <line x1="-129.9" y1="75" x2="-141.4" y2="81.6"/>
          <line x1="-75" y1="129.9" x2="-81.6" y2="141.4"/>
        </g>
      </g>

      <!-- crescent, hatched -->
      <g filter="url(#sketch)">
        <path d="M -14 -46 A 46 46 0 1 0 -14 46 A 36 36 0 1 1 -14 -46 Z"
              fill="url(#hatch)" stroke="#EDE3CF" stroke-width="1.2" stroke-opacity="0.6"/>
      </g>

      <!-- needle -->
      <g filter="url(#sketch)">
        <path d="M 0 -86 L 7 0 L 0 86 L -7 0 Z" fill="none" stroke="#C1673B" stroke-width="1.3" stroke-opacity="0.85"/>
        <circle r="3.2" fill="#C1673B"/>
      </g>

      <!-- scattered marks -->
      <g fill="#EDE3CF" filter="url(#sketch)">
        <circle cx="-205" cy="-98" r="1.6" opacity="0.6"/>
        <circle cx="215" cy="-40" r="1.3" opacity="0.5"/>
        <circle cx="-190" cy="70" r="1.4" opacity="0.55"/>
        <circle cx="200" cy="110" r="1.6" opacity="0.5"/>
        <circle cx="-40" cy="-205" r="1.3" opacity="0.45"/>
      </g>
    </g>

    <!-- type -->
    <rect x="76" y="118" width="1.4" height="94" fill="url(#rule)"/>

    <text x="112" y="168" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
          font-size="52" letter-spacing="4" fill="#EDE3CF">MOHITH KUMAR</text>

    <text x="114" y="200" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="12.5" letter-spacing="4.6" fill="#8FA0A8">TAKES THE LONG WAY TO BE SURE</text>

    <rect width="1200" height="320" filter="url(#grain)" opacity="0.05"/>
  </g>
</svg>
