<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Mohith Kumar — GitHub profile banner</title>
<desc>Dark minimal banner with code grid background, name, and role</desc>
<style>
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .grid { stroke: #21262d; }
    .name { fill: #e6edf3; }
    .sub { fill: #8b949e; }
    .accent { fill: #58a6ff; }
    .dot { fill: #21262d; }
    .tag { fill: #161b22; stroke: #30363d; }
    .tag-t { fill: #58a6ff; }
    .line { stroke: #30363d; }
    .cursor { fill: #58a6ff; }
  }
  @media (prefers-color-scheme: light) {
    .bg { fill: #f6f8fa; }
    .grid { stroke: #d0d7de; }
    .name { fill: #1f2328; }
    .sub { fill: #57606a; }
    .accent { fill: #0969da; }
    .dot { fill: #d0d7de; }
    .tag { fill: #ffffff; stroke: #d0d7de; }
    .tag-t { fill: #0969da; }
    .line { stroke: #d0d7de; }
    .cursor { fill: #0969da; }
  }
</style>

<rect width="680" height="160" rx="8" class="bg"/>

<g opacity="0.5">
  <line x1="0" y1="40" x2="680" y2="40" class="grid" stroke-width="0.5"/>
  <line x1="0" y1="80" x2="680" y2="80" class="grid" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="680" y2="120" class="grid" stroke-width="0.5"/>
  <line x1="80" y1="0" x2="80" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="160" y1="0" x2="160" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="240" y1="0" x2="240" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="320" y1="0" x2="320" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="480" y1="0" x2="480" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="560" y1="0" x2="560" y2="160" class="grid" stroke-width="0.5"/>
  <line x1="640" y1="0" x2="640" y2="160" class="grid" stroke-width="0.5"/>
</g>

<circle cx="80" cy="40" r="2.5" class="dot"/>
<circle cx="160" cy="40" r="2.5" class="dot"/>
<circle cx="240" cy="40" r="2.5" class="dot"/>
<circle cx="320" cy="40" r="2.5" class="dot"/>
<circle cx="400" cy="40" r="2.5" class="dot"/>
<circle cx="480" cy="40" r="2.5" class="dot"/>
<circle cx="560" cy="40" r="2.5" class="dot"/>
<circle cx="640" cy="40" r="2.5" class="dot"/>
<circle cx="80" cy="80" r="2.5" class="dot"/>
<circle cx="160" cy="80" r="2.5" class="dot"/>
<circle cx="240" cy="80" r="2.5" class="dot"/>
<circle cx="320" cy="80" r="2.5" class="dot"/>
<circle cx="400" cy="80" r="2.5" class="dot"/>
<circle cx="480" cy="80" r="2.5" class="dot"/>
<circle cx="560" cy="80" r="2.5" class="dot"/>
<circle cx="640" cy="80" r="2.5" class="dot"/>
<circle cx="80" cy="120" r="2.5" class="dot"/>
<circle cx="160" cy="120" r="2.5" class="dot"/>
<circle cx="240" cy="120" r="2.5" class="dot"/>
<circle cx="320" cy="120" r="2.5" class="dot"/>
<circle cx="400" cy="120" r="2.5" class="dot"/>
<circle cx="480" cy="120" r="2.5" class="dot"/>
<circle cx="560" cy="120" r="2.5" class="dot"/>
<circle cx="640" cy="120" r="2.5" class="dot"/>

<rect x="40" y="52" width="3" height="28" class="accent" rx="1.5"/>

<text x="54" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" class="name" letter-spacing="-0.5">Mohith Kumar</text>

<text x="55" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" class="sub">Backend Engineer — Java · Spring Boot · System Design</text>

<rect x="55" y="108" width="64" height="22" rx="4" class="tag"/>
<text x="87" y="123" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" class="tag-t">Java</text>

<rect x="127" y="108" width="90" height="22" rx="4" class="tag"/>
<text x="172" y="123" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" class="tag-t">Spring Boot</text>

<rect x="225" y="108" width="90" height="22" rx="4" class="tag"/>
<text x="270" y="123" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" class="tag-t">PostgreSQL</text>

<rect x="323" y="108" width="56" height="22" rx="4" class="tag"/>
<text x="351" y="123" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" class="tag-t">Redis</text>

<rect x="387" y="108" width="58" height="22" rx="4" class="tag"/>
<text x="416" y="123" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" class="tag-t">Docker</text>

<text x="626" y="72" font-family="'Courier New', monospace" font-size="11" class="sub" text-anchor="middle">Hyderabad</text>
<text x="626" y="88" font-family="'Courier New', monospace" font-size="11" class="sub" text-anchor="middle">India</text>

</svg>
